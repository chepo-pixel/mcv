<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>MCV Generator v1.2</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"></head><body><main class="app"><section class="card"><div class="brand"><div><h1>MCV Generator <small>v1.2</small></h1></div></div><div class="inputs"><label>Minimum MCV<input id="min" type="number" min="0" max="20" step="0.1" value="8"></label><label>Maximum MCV<input id="max" type="number" min="0" max="20" step="0.1" value="12"></label><label>Number of tests<input id="count" type="number" min="1" max="30" step="1" value="1"></label></div><details><summary>Advanced options</summary><div class="inputs"><label>Minimum S.S.L. points<input id="kmin" type="number" min="2" max="8" step="1" value="3"></label><label>Maximum S.S.L. points<input id="kmax" type="number" min="2" max="8" step="1" value="5"></label><label>MCV tolerance<input id="tol" type="number" min="0.01" max="0.2" step="0.01" value="0.05"></label></div><p class="hint">S.S.L. points are randomly selected within your range. The test stops at the first change in penetration below 5 mm; supporting penetration readings needed for the n–4n calculation remain visible.</p></details><button id="generate" class="primary">Generate MCV tests</button><p id="status" role="status"></p><div id="results"></div></section></main><script src="app.js"></script></body></html>
